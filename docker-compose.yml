services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: deepa
      POSTGRES_PASSWORD: deepa
      POSTGRES_DB: deepa_inventory
    ports: ["5432:5432"]
    volumes: ["deepa_pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U deepa"]
      interval: 5s
      retries: 10
volumes:
  deepa_pgdata:
